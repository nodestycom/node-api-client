name: check
on:
    push:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v5

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check generated code, lint, types, and tests
              run: pnpm check
